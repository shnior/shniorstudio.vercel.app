name: promo capture (temporary)
on:
  push:
    branches: [promo-capture]
    paths: ['promo-tools/**', '.github/workflows/promo-capture.yml']
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd promo-tools && npm init -y >/dev/null && npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-color-emoji >/dev/null || true
      - run: cd promo-tools && node capture.js && mv promo ../promo
      - run: |
          git config user.name promo-capture
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add promo && git commit -m "promo captures [skip ci]" && git push
