@keyframes stageIn { from { opacity: .001; transform: translateY(24px) scale(.96); } }

  const EYE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5C6.5 5 2.7 9.4 1.5 12c1.2 2.6 5 7 10.5 7s9.3-4.4 10.5-7C21.3 9.4 17.5 5 12 5Zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8Z"/></svg>';
  if (!reduce) document.documentElement.classList.add('anim');
  $('year').textContent = new Date().getFullYear();

  /* header playhead + timecode, same as the home page */
  const playhead = $('playhead'), played = $('played'), tc = $('tc');
  let ticking = false;
  function onScroll() {
    const p = Math.min(1, Math.max(0, scrollY / Math.max(1, document.documentElement.scrollHeight - innerHeight)));
    playhead.style.right = played.style.width = (p * 100) + '%';
    ticking = false;
  }
  addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(onScroll); } }, { passive: true });
  onScroll();

  const menuBtn = $('menu-btn');
  menuBtn.addEventListener('click', () => {
    const open = !document.body.classList.contains('menu-open');
    document.body.classList.toggle('menu-open', open); menuBtn.setAttribute('aria-expanded', String(open));
  });

  /* titles on YouTube carry hashtags and emoji; show them clean */
  const cleanTitle = t => String(t || '')
    .replace(/#[^\s#]+/g, '')
    .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu, '')
    .replace(/\s+/g, ' ').replace(/[\s\-–|]+$/g, '').trim() || 'Short';
  const parseViews = v => {
    const m = String(v).replace(/,/g, '').match(/([\d.]+)\s*([KMאלףמיליון]*)/i);
    if (!m) return 0;
    const n = parseFloat(m[1]), u = (m[2] || '').toUpperCase();
    return Math.round(n * (u.startsWith('K') || u.startsWith('א') ? 1e3 : u.startsWith('M') || u.startsWith('מ') ? 1e6 : 1));
  };
  const fmtViews = n => n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K' : String(n);
  const rel = iso => {
    if (!iso) return '';
    const d = (Date.now() - new Date(iso)) / 864e5;
    if (d < 1) return 'היום';
    if (d < 2) return 'אתמול';
    if (d < 30) return `לפני ${Math.floor(d)} ימים`;
    if (d < 365) { const m = Math.floor(d / 30); return m === 1 ? 'לפני חודש' : `לפני ${m} חודשים`; }
    const y = Math.floor(d / 365); return y === 1 ? 'לפני שנה' : `לפני ${y} שנים`;
  };

  let items = [];
  const io = (!reduce && 'IntersectionObserver' in window) ? new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
  }), { rootMargin: '0px 0px -6% 0px', threshold: .08 }) : null;

  function countUp(el, n, fmt = String) {
    if (reduce || !n) { el.textContent = fmt(n); return; }
    const t0 = performance.now();
    const step = now => { const p = Math.min(1, (now - t0) / 1300); el.textContent = fmt(Math.round(n * (1 - Math.pow(1 - p, 3)))); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }

  function render() {
    const reel = $('reel');
    if (!items.length) {
      reel.innerHTML = `<p class="note">הסרטונים לא נטענו כרגע. אפשר לצפות בהם <a href="https://www.youtube.com/@shnioreizenbach/shorts" target="_blank" rel="noopener">ישירות בערוץ ביוטיוב</a>.</p>`;
      return;
    }
    reel.innerHTML = items.map((s, i) => `
      <button class="short rv" type="button" data-i="${i}" style="--d:${(i % 5) * 70}ms" aria-label="ניגון: ${esc(s.clean)}">
        <div class="short-frame">
          <img src="${esc(s.thumb || `https://i.ytimg.com/vi/${s.id}/oar2.jpg`)}" alt="" loading="${i < 10 ? 'eager' : 'lazy'}" decoding="async" data-id="${esc(s.id)}">
          <span class="short-n mono">${pad(items.length - i, 2)}</span>
          ${s.views ? `<span class="short-views">${EYE}${esc(s.viewsShort)}</span>` : ''}
          <span class="short-play"><i>${PLAY}</i></span>
        </div>
        <div><h2>${esc(s.clean)}</h2>${s.published ? `<span class="when">${rel(s.published)}</span>` : ''}</div>
      </button>`).join('');
    reel.querySelectorAll('.short').forEach(b => {
      b.addEventListener('click', () => openPlayer(+b.dataset.i));
      if (io) io.observe(b); else b.classList.add('in');
    });
    reel.querySelectorAll('img[data-id]').forEach(img => img.addEventListener('error', () => {
      if (img.dataset.fb) return; img.dataset.fb = '1'; img.src = `https://i.ytimg.com/vi/${img.dataset.id}/hqdefault.jpg`;
    }, { once: true }));
    countUp($('stat-count'), items.length);
    countUp($('stat-views'), items.reduce((a, s) => a + s.viewsNum, 0), fmtViews);
  }

  /* player: one Short at a time, arrows / keys / swipe to move */
  let cur = -1, lastFocus = null, touchY = null;
  function show(i) {
    cur = Math.max(0, Math.min(items.length - 1, i));
    const s = items[cur];
    $('p-stage').innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${s.id}?autoplay=1&playsinline=1&rel=0&loop=1&playlist=${s.id}" title="${esc(s.clean)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
    $('p-stage').style.animation = 'none'; void $('p-stage').offsetWidth; $('p-stage').style.animation = '';
    $('p-title').textContent = s.clean;
    $('p-n').textContent = `${pad(items.length - cur)} / ${pad(items.length)}`;
    $('p-views').textContent = s.views;
    $('p-yt').href = `https://www.youtube.com/shorts/${s.id}`;
    $('p-prev').disabled = cur === 0;
    $('p-next').disabled = cur === items.length - 1;
  }
  function openPlayer(i) {
    lastFocus = document.activeElement;
    $('player').hidden = false; document.body.classList.add('player-open');
    show(i); $('p-close').focus();
  }
  function closePlayer() {
    if (location.hash) history.replaceState(null, '', location.pathname);
    $('player').hidden = true; document.body.classList.remove('player-open');
    $('p-stage').innerHTML = ''; cur = -1;
    if (lastFocus) lastFocus.focus();
  }
  $('p-close').addEventListener('click', closePlayer);
  $('p-prev').addEventListener('click', () => show(cur - 1));
  $('p-next').addEventListener('click', () => show(cur + 1));
  $('player').addEventListener('click', e => { if (e.target === $('player')) closePlayer(); });
  addEventListener('keydown', e => {
    if ($('player').hidden) { if (e.key === 'Escape') document.body.classList.remove('menu-open'); return; }
    if (e.key === 'Escape') closePlayer();
    if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') { e.preventDefault(); if (cur < items.length - 1) show(cur + 1); }
    if (e.key === 'ArrowUp' || e.key === 'ArrowRight') { e.preventDefault(); if (cur > 0) show(cur - 1); }
  });
  $('player').addEventListener('touchstart', e => { touchY = e.touches[0].clientY; }, { passive: true });
  $('player').addEventListener('touchend', e => {
    if (touchY === null) return;
    const dy = e.changedTouches[0].clientY - touchY; touchY = null;
    if (Math.abs(dy) > 60) show(cur + (dy < 0 ? 1 : -1));
  });

  fetch('/api/shorts')
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(d => {
      items = (d.items || []).map(s => {
        const viewsNum = parseViews(s.views);
        return { ...s, clean: cleanTitle(s.title), viewsNum, viewsShort: viewsNum ? fmtViews(viewsNum) : '' };
      });
      render();
      // opened from the home page strip: play that Short right away
      const fromHash = decodeURIComponent(location.hash.slice(1));
      const at = fromHash ? items.findIndex(x => x.id === fromHash) : -1;
      if (at >= 0) openPlayer(at);
    })
    .catch(() => { items = []; render(); });
})();
</script>
<script>
/* mobile menu squares: built ahead of time so they can animate in, staggered from the menu button */
(() => {
  const nav = document.querySelector('.nav');
  if (!nav) return;
  const tiles = document.createElement('div');
  tiles.className = 'tiles';
  tiles.setAttribute('aria-hidden', 'true');
  nav.prepend(tiles);
  nav.querySelectorAll('a').forEach((a, i) => a.style.setProperty('--i', i));
  let key = '';
  function build() {
    if (innerWidth > 860) return;
    const w = nav.clientWidth || innerWidth, h = nav.clientHeight || innerHeight;
    const cols = w < 480 ? 6 : 8, size = w / cols, rows = Math.ceil(h / size) + 1;
    if (key === cols + 'x' + rows) return;
    key = cols + 'x' + rows;
    tiles.style.setProperty('--cols', cols);
    tiles.style.setProperty('--tile', size + 'px');
    let html = '';
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) html += `<i data-s="${x + y}"></i>`;
    tiles.innerHTML = html;
    stagger(document.body.classList.contains('menu-open'));
  }
  function stagger(open) {
    const all = [...tiles.children];
    const max = all.reduce((m, t) => Math.max(m, +t.dataset.s), 0);
    all.forEach(t => { const s = +t.dataset.s; t.style.setProperty('--d', (open ? s : max - s) * 26 + 'ms'); });
  }
  build();
  let rt;
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(build, 150); });
  new MutationObserver(() => stagger(document.body.classList.contains('menu-open')))
    .observe(document.body, { attributes: true, attributeFilter: ['class'] });
})();
</script>
</body>
</html>
